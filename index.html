<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BoardMatch — Catalogue de snowboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1 class="brand">BoardMatch</h1>
    <nav class="filters" aria-label="Filtrer les planches">
      <label class="visually-hidden" for="filtre-niveau">Filtrer par niveau</label>
      <select id="filtre-niveau" class="filter-field">
        <option value="">Niveau &#9662;</option>
        <option value="Expert">Expert</option>
        <option value="Interm&eacute;diaire">Interm&eacute;diaire</option>
        <option value="D&eacute;butant">D&eacute;butant</option>
      </select>
      <label class="visually-hidden" for="filtre-style">Filtrer par style</label>
      <select id="filtre-style" class="filter-field">
        <option value="">Style &#9662;</option>
        <option value="Freestyle">Freestyle</option>
        <option value="All-mountain">All-mountain</option>
        <option value="Freeride">Freeride</option>
      </select>
    </nav>
  </header>

  <main>
    <h2 class="visually-hidden">Liste des planches disponibles</h2>
    <section class="list" id="liste-planches">
      <article class="row" data-niveau="Expert" data-style="Freestyle">
        <svg class="picto" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="1.2" aria-hidden="true"><ellipse cx="12" cy="12" rx="9" ry="3.2" transform="rotate(-20 12 12)"/></svg>
        <div class="info">
          <h3 class="name">Burton Custom</h3>
          <p class="meta">Expert &middot; Freestyle</p>
        </div>
        <p class="price">650.-</p>
      </article>
      <article class="row" data-niveau="Interm&eacute;diaire" data-style="All-mountain">
        <svg class="picto" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="1.2" aria-hidden="true"><ellipse cx="12" cy="12" rx="9" ry="3.2" transform="rotate(-20 12 12)"/></svg>
        <div class="info">
          <h3 class="name">Rossignol XV</h3>
          <p class="meta">Interm&eacute;diaire &middot; All-mountain</p>
        </div>
        <p class="price">480.-</p>
      </article>
      <article class="row" data-niveau="D&eacute;butant" data-style="Freeride">
        <svg class="picto" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="1.2" aria-hidden="true"><ellipse cx="12" cy="12" rx="9" ry="3.2" transform="rotate(-20 12 12)"/></svg>
        <div class="info">
          <h3 class="name">Nitro Prime</h3>
          <p class="meta">D&eacute;butant &middot; Freeride</p>
        </div>
        <p class="price">390.-</p>
      </article>
      <article class="row" data-niveau="Expert" data-style="All-mountain">
        <svg class="picto" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="1.2" aria-hidden="true"><ellipse cx="12" cy="12" rx="9" ry="3.2" transform="rotate(-20 12 12)"/></svg>
        <div class="info">
          <h3 class="name">Salomon Sight</h3>
          <p class="meta">Expert &middot; All-mountain</p>
        </div>
        <p class="price">720.-</p>
      </article>
    </section>

    <p class="empty" id="empty-state">Aucune planche ne correspond &agrave; ce filtre.</p>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 &mdash; Colin Benamo-van Dijk</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
