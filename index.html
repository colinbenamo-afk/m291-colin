<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BoardMatch — Catalogue de snowboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1 class="brand">BoardMatch</h1>
    <nav class="filters" aria-label="Filtrer les planches">
      <label class="visually-hidden" for="filtre-niveau">Filtrer par niveau</label>
      <select id="filtre-niveau" class="filter-field">
        <option value="">Niveau &#9662;</option>
        <option value="Expert">Expert</option>
        <option value="Interm&eacute;diaire">Interm&eacute;diaire</option>
        <option value="D&eacute;butant">D&eacute;butant</option>
      </select>
      <label class="visually-hidden" for="filtre-style">Filtrer par style</label>
      <select id="filtre-style" class="filter-field">
        <option value="">Style &#9662;</option>
        <option value="Freestyle">Freestyle</option>
        <option value="All-mountain">All-mountain</option>
        <option value="Freeride">Freeride</option>
      </select>
    </nav>
  </header>

  <main>
    <h2 class="visually-hidden">Liste des planches disponibles</h2>

    <div class="search-field">
      <label for="recherche">Rechercher une planche</label>
      <input type="search" id="recherche" placeholder="Ex: Burton, Custom&hellip;">
    </div>

    <section class="list" id="liste-planches">
      <!-- Les cartes planches sont injectées ici par js/app.js (fetch sur data.json) -->
    </section>

    <p class="empty" id="empty-state">Aucune planche ne correspond &agrave; ce filtre.</p>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 &mdash; Colin Benamo-van Dijk</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
